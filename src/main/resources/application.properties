spring.application.name=gateway

# --- HTTP server ---
# Bind to localhost only — all remote access goes through MQTT.
# Change to 0.0.0.0 only if a local client (e.g. a UI on the same device) needs LAN access.
server.port=9098
server.address=127.0.0.1

# --- SQLite ---
spring.datasource.url=jdbc:sqlite:./gateway.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=20000
# SQLite doesn't support DDL in transactions
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL;
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- AWS IoT MQTT (gateway uses mTLS — certs loaded from provisioned.creds) ---
aws.iot.endpoint=a2cpmq9cvvl5vi-ats.iot.us-east-1.amazonaws.com

# --- Home Assistant ---
# Standalone/dev mode (ignored if the SUPERVISOR_TOKEN env var is present — see
# HomeAssistantConnectionConfig, which then talks to the Supervisor-managed HA Core instead).
homeassistant.enabled=true
homeassistant.url=http://localhost:8123
homeassistant.token=
homeassistant.ws.path=/api/websocket

# --- Telemetry ---
# How often (seconds) the telemetry buffer is flushed to MQTT as a batch
telemetry.flush.interval.seconds=60

# --- Auth ---
# Credentials for the local REST API. Change before exposing to LAN.
gateway.auth.username=admin
gateway.auth.password=changeme
# JWT signing secret — generated randomly on startup if left blank.
gateway.auth.jwt.secret=
gateway.auth.jwt.expiry.hours=24

# --- Audio inference service (Python / Mosquitto local) ---
audio.mqtt.enabled=true
audio.mqtt.broker=localhost
audio.mqtt.port=1883
audio.mqtt.location=plomo
# Event types that trigger an immediate alert to AWS IoT (bypassing the 60s telemetry buffer).
# Only events with confidence_level=HIGH qualify. Comma-separated, no spaces.
audio.alert.critical-types=INTRUSION,FIRE_ALARM,PERSON_DISTRESS

# --- OTA ---
gateway.ota.jar-path=/opt/gateway/gateway.jar
gateway.ota.service-name=gateway

# --- Files ---
gateway.conf.path=./gateway.conf
gateway.creds.path=./provisioned.creds

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.tagsSorter=alpha

# --- Logging ---
logging.level.root=INFO
logging.level.uy.plomo.gateway=DEBUG
logging.pattern.console=%d{dd/MM HH:mm:ss.SSS} %clr(%-5level) %-20.20(%replace([%-18.18thread]){\\s*]$,]}) %msg%n
