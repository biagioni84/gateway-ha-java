# Test profile — used by GatewayApplicationTests (@ActiveProfiles("test"))

# Prevent Spring Boot from replacing the datasource with an in-memory SQLite URL
# (the auto-configured URL uses :memory:?cache=shared which Windows rejects as a path)
spring.test.database.replace=none
spring.datasource.url=jdbc:sqlite:./gateway-test.db

# Skip hardware-dependent subsystems
aws.iot.endpoint=disabled
zigbee.enabled=false
